defaults:
  - callbacks: calvin
  - datamodule: calvin
  - model: flower
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

root_data_dir: ${oc.env:TMPDIR}/data/task_ABC_D #/hkfs/work/workspace/scratch/uruox-itrap_flower_abc/data/task_ABC_D
vis_lang_folder: ${oc.env:TMPDIR}/data/vis_lang_clip_resnet50 #/home/hk-project-p0024638/uruox/data/iTRAP-FLOWER/calvin_policy_dataset/vis_lang_clip_resnet50

log_dir: /home/troth/code/hiwi/iTRAP/logs #${oc.env:TMPDIR}/logs
slurm: false
seed: 242
device: 'cuda'
batch_size: 8
devices: 4
act_dim: 7
proprio_dims: 7
obs_dim: 512
goal_dim: 512
obs_seq_len: 1
act_seq_len: 10
multistep: 10 #${act_seq_len}
p_last_state: 0
gen_img_res: 112
max_epochs: 35
rollout_lh_skip_epochs: 19
num_workers: 12
benchmark_name: flower_calvin_abc
use_extracted_rel_actions: False

trainer:
  devices: ${devices}
  precision: bf16-mixed
  max_epochs: ${max_epochs}
  sync_batchnorm: True
  accelerator: gpu
  strategy: "ddp" 
  limit_train_batches: 1000 #1.0 # percentage of train data to use
  limit_val_batches: 4

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: .
  name: logger
  group: flower
  log_model: false
  project: ${benchmark_name}
  entity: thomas-roth-karlsruhe-institute-of-technology
  id: ???

hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}_seed${seed}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir
          - trainer.gpus
          - datamodule.num_workers
          - trainer.limit_train_batches
          - trainer.limit_val_batches
